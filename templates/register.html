{% extends "base.html" %}{% block content %}<div class="auth panel"><h2>Create account</h2><p class="text-secondary">Start managing your monthly budget.</p><form method="post"><label class="form-label">Name</label><input class="form-control mb-3" name="name" required><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password (8+ characters)</label><input class="form-control mb-4" type="password" name="password" minlength="8" required><button class="btn btn-primary w-100">Register</button></form><p class="mt-3">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div>{% endblock %}
